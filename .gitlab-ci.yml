variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Base de l'image commune
  IMAGE_BASE_NAME: "newnelson.veolia-es.net:8084/idbatv7-bff/image"
  
  # Configuration Kubernetes
  K8S_POD_NAME: "idbatv7-bff"
  K8S_NAMESPACE_DEV: "nsv-rec-idbat-01"
  K8S_NAMESPACE_REC: "nsv-rec-idbat-01"
  K8S_LABELS: "app=idbatv7bff"
  K8S_PORT: "8081"
  
  # Configuration Base de données - DEV
  BACKEND_URI_DEV: "http://idbatv7back:80"

  # Configuration Base de données - REC
  BACKEND_URI_REC: "http://idbatv7back:80"
  BASE_PROTOCOL: "https"
  BASE_URI: "idbat-rec-bff.recyclage.veolia.fr"
  VALIDATE_TOKEN_URI: "http://idbatv7back:80/api/auth/validate"

  # AWS CloudWatch Configuration
  AWS_REGION: "eu-west-3"
  # TODO: Set these in GitLab CI/CD Variables (Settings > CI/CD > Variables) as masked variables

  
  # Ressources Pod
  K8S_MEMORY_REQUEST: "512Mi"
  K8S_CPU_REQUEST: "250m"
  K8S_MEMORY_LIMIT: "768Mi"
  K8S_CPU_LIMIT: "500m"


stages:
  - cleanup
  - build
  - package
  - deploy
  - kubernetes

cleanup-workspace:
  stage: cleanup
  tags:
    - idbatv7
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Reparation des permissions du workspace..."
    - docker run --rm -v "$(pwd)":/app -w /app alpine:latest chown -R $(id -u):$(id -g) . || true

gradle-build:
  stage: build
  tags:
    - idbatv7
  script:
    - chmod +x gradlew
    - docker run --rm -v "$(pwd)":/app -w /app eclipse-temurin:21-jdk /bin/bash -c "./gradlew build -x test; RET=\$?; chown -R $(id -u):$(id -g) .; exit \$RET"
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week
  needs:
    - cleanup-workspace

# --- Jobs pour DEVELOP (avec SHA) ---

docker-build-dev:
  stage: package
  tags:
    - idbatv7
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG_UNIQUE" .
  needs:
    - gradle-build

docker-push-dev:
  stage: deploy
  tags:
    - idbatv7
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - docker push "$IMAGE_TAG_UNIQUE"
    - echo "Image poussée avec succes :"
    - echo "- $IMAGE_TAG_UNIQUE"
  needs:
    - docker-build-dev
    


k8s-deploy-dev:
  stage: kubernetes
  tags:
    - v-idbat
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    CLOUDWATCH_LOG_GROUP: "/aws/kubernetes/idbatv7-back-integration"
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
    - kubectl version --client
  script:
    - kubectl delete pod $K8S_POD_NAME -n $K8S_NAMESPACE_DEV --ignore-not-found=true
    - kubectl run $K8S_POD_NAME --image=$IMAGE_TAG_UNIQUE -n $K8S_NAMESPACE_DEV --labels=$K8S_LABELS --port=$K8S_PORT --env="K8S_PORT=$K8S_PORT" --env="VALIDATE_TOKEN_URI=$VALIDATE_TOKEN_URI" --env="BACKEND_URI=$BACKEND_URI_DEV" --env="AWS_REGION=$AWS_REGION" --env="CLOUDWATCH_LOG_GROUP=$CLOUDWATCH_LOG_GROUP" --env="AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" --env="AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" --dry-run=client -o yaml > /tmp/deploy.yaml
    - kubectl set resources --local -f /tmp/deploy.yaml --requests="memory=$K8S_MEMORY_REQUEST,cpu=$K8S_CPU_REQUEST" --limits="memory=$K8S_MEMORY_LIMIT,cpu=$K8S_CPU_LIMIT" -o yaml > /tmp/deployment.yaml
    - kubectl apply -f /tmp/deployment.yaml 
    - kubectl wait --for=condition=Ready pod/$K8S_POD_NAME -n $K8S_NAMESPACE_DEV --timeout=300s
  needs:
    - docker-push-dev

# --- Jobs pour RELEASE (sans SHA) ---

docker-build-rec:
  stage: package
  tags:
    - idbatv7
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - docker build -t "$IMAGE_TAG_UNIQUE" .
  needs:
    - gradle-build

docker-push-rec:
  stage: deploy
  tags:
    - idbatv7
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  script:
    - docker push "$IMAGE_TAG_UNIQUE"
    - echo "Image poussée avec succes :"
    - echo "- $IMAGE_TAG_UNIQUE"
  needs:
    - docker-build-rec

k8s-deploy-rec:
  stage: kubernetes
  tags:
    - v-idbat
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*$/
  variables:
    IMAGE_TAG_UNIQUE: "$IMAGE_BASE_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    CLOUDWATCH_LOG_GROUP: "/aws/kubernetes/idbatv7-back-integration"
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
    - kubectl version --client
  script:
    - kubectl delete pod $K8S_POD_NAME -n $K8S_NAMESPACE_REC --ignore-not-found=true
    - kubectl run $K8S_POD_NAME --image=$IMAGE_TAG_UNIQUE -n $K8S_NAMESPACE_REC --labels=$K8S_LABELS --port=$K8S_PORT --env="BACKEND_URI=$BACKEND_URI_REC" --env="VALIDATE_TOKEN_URI=$VALIDATE_TOKEN_URI" --env="BASE_PROTOCOL=$BASE_PROTOCOL" --env="BASE_URI=$BASE_URI" --env="AWS_REGION=$AWS_REGION" --env="CLOUDWATCH_LOG_GROUP=$CLOUDWATCH_LOG_GROUP" --env="AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" --env="AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" --dry-run=client -o yaml > /tmp/deploy.yaml
    - kubectl set resources --local -f /tmp/deploy.yaml --requests="memory=$K8S_MEMORY_REQUEST,cpu=$K8S_CPU_REQUEST" --limits="memory=$K8S_MEMORY_LIMIT,cpu=$K8S_CPU_LIMIT" -o yaml > /tmp/deployment.yaml
    - kubectl apply -f /tmp/deployment.yaml 
    - kubectl wait --for=condition=Ready pod/$K8S_POD_NAME -n $K8S_NAMESPACE_REC --timeout=300s
  needs:
    - docker-push-rec
