server:
  port: ${K8S_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework
  netty:
    connection-timeout: 5000
  max-http-request-header-size: 16KB

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web: DEBUG

spring:
  application:
    name: idbat-v7-bff
  lifecycle:
    timeout-per-shutdown-phase: "5s"
  cloud:
    gateway:
      # Configuration CORS globale pour le BFF
      # C'est le BFF qui répond au navigateur pour les requêtes OPTIONS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
      httpclient:
        max-header-size: 16384 # 16KB
        connect-timeout: 5000
        response-timeout: 10s
        ssl:
          useInsecureTrustManager: true
      routes:
        - id: backend_route
          uri: ${BACKEND_URI:http://localhost:8081}
          predicates:
            - Path=/front/**
          filters:
            - StripPrefix=1
            # On ajoute le préfixe pour que le backend sache (s'il est configuré pour)
            - AddRequestHeader=X-Forwarded-Prefix, /front
            # On supprime le header Forwarded qui faisait planter le backend (IP mal formée)
            - RemoveRequestHeader=Forwarded
            - RemoveRequestHeader=X-Forwarded-For
            # On déduplique les headers CORS pour éviter que le navigateur ne reçoive ceux du BFF + ceux du Backend
            # RETAIN_FIRST : On garde ceux du BFF (qui sont permissifs)
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
  main:
    cloud-platform: kubernetes

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: Backend API
        url: /front/v3/api-docs
    path: /swagger-ui.html

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true