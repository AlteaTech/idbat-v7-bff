server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: idbat-v7-bff
  lifecycle:
    timeout-per-shutdown-phase: "5s"
  cloud:
    gateway:
      routes:
        - id: default_route
          uri: http://localhost:8081
          predicates:
            - Path=/front/**
          filters:
            - RewritePath=/front/(?<segment>.*), /$\{segment}
      # Configuration pour K8s (readiness/liveness probes)
  main:
    cloud-platform: kubernetes

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true